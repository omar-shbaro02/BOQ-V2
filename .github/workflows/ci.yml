name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contracts-and-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv pip install --system -r services/api/requirements.lock
      - run: uv pip install --system --no-deps -e services/api
      - run: python3 scripts/generate_contracts.py --check
      - run: ruff check services/api scripts
      - run: ruff format --check services/api scripts
      - run: pytest

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint:web
      - run: npm run typecheck:web
      - run: npm run build:web
