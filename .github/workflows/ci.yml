name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contracts-and-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv venv --python 3.12
      - run: uv pip install --python .venv/bin/python -r services/api/requirements.lock
      - run: uv pip install --python .venv/bin/python --no-deps -e services/api
      - run: python3 scripts/generate_contracts.py --check
      - run: .venv/bin/ruff check services/api scripts
      - run: .venv/bin/ruff format --check services/api scripts
      - run: .venv/bin/pytest

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint:web
      - run: npm run typecheck:web
      - run: npm run build:web

  installer-smoke:
    runs-on: ubuntu-latest
    needs: [contracts-and-api, web]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f compose.installer.yml up -d --build --wait
      - run: curl --fail --show-error http://localhost:8000/health
      - run: curl --fail --show-error http://localhost:3000/
      - run: sh scripts/package_installers.sh
      - run: sha256sum --check dist/installers/SHA256SUMS.txt
      - if: always()
        run: docker compose -f compose.installer.yml down --volumes
