services:
  postgres:
    image: docker.io/postgres:17-alpine
    environment:
      POSTGRES_DB: vai
      POSTGRES_USER: vai
      POSTGRES_PASSWORD: vai
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vai -d vai"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - vai_postgres_data:/var/lib/postgresql/data

volumes:
  vai_postgres_data:

